<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc"><title id="title">The Remnary evidence workflow</title><desc id="desc">Select sources, retain encrypted evidence, extract candidate connections, review, and read the dashboard or Markdown vault.</desc><rect width="1280" height="330" rx="24" fill="#f2f5fa"/><text x="40" y="57" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1b263b">FROM FRAGMENTS TO A RECORD YOU CAN CHECK</text><rect x="40" y="104" width="220" height="145" rx="14" fill="white" stroke="#dce3ed"/><text x="58" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#279caf">01</text><text x="58" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1b263b">Select sources</text><text x="58" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64728a">Exports + local logs</text><path d="M264 177 h17 l-5 -5 m5 5 l-5 5" fill="none" stroke="#4e5bd9" stroke-width="2"/><rect x="286" y="104" width="220" height="145" rx="14" fill="white" stroke="#dce3ed"/><text x="304" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#279caf">02</text><text x="304" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1b263b">Keep evidence</text><text x="304" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64728a">Encrypted archive</text><path d="M510 177 h17 l-5 -5 m5 5 l-5 5" fill="none" stroke="#4e5bd9" stroke-width="2"/><rect x="532" y="104" width="220" height="145" rx="14" fill="white" stroke="#dce3ed"/><text x="550" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#279caf">03</text><text x="550" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1b263b">Find connections</text><text x="550" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64728a">Rules / local model</text><path d="M756 177 h17 l-5 -5 m5 5 l-5 5" fill="none" stroke="#4e5bd9" stroke-width="2"/><rect x="778" y="104" width="220" height="145" rx="14" fill="white" stroke="#dce3ed"/><text x="796" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#279caf">04</text><text x="796" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1b263b">Review the claim</text><text x="796" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64728a">Confirm or correct</text><path d="M1002 177 h17 l-5 -5 m5 5 l-5 5" fill="none" stroke="#4e5bd9" stroke-width="2"/><rect x="1024" y="104" width="220" height="145" rx="14" fill="white" stroke="#dce3ed"/><text x="1042" y="139" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#279caf">05</text><text x="1042" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1b263b">Read your record</text><text x="1042" y="216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#64728a">Dashboard + vault</text><text x="40" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#64728a">Exact source links stay attached. Recurrence never confirms a personal fact.</text></svg>
