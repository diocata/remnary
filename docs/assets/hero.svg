<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc"><title id="title">Remnary — Your thoughts leave traces. We connect them.</title><desc id="desc">Original illustration: fragments of conversation connect to a personal journal.</desc><rect width="1280" height="500" rx="24" fill="#f2f5fa"/><text x="58" y="69" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64728a">A LIVING RECORD, BUILT FROM THE TRACES YOU LEAVE</text><g fill="none" stroke="#279caf" stroke-width="2.5"><ellipse cx="82" cy="139" rx="29" ry="14" transform="rotate(-40 82 139)"/><ellipse cx="82" cy="139" rx="29" ry="14" transform="rotate(40 82 139)"/></g><circle cx="82" cy="139" r="5" fill="#4e5bd9"/><text x="128" y="163" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#1b263b">remnary.</text><text x="58" y="249" font-family="Arial, sans-serif" font-size="35" font-weight="600" fill="#1b263b">Your thoughts leave traces.</text><text x="58" y="296" font-family="Arial, sans-serif" font-size="35" font-weight="600" fill="#4e5bd9">We connect them.</text><text x="58" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#64728a">Ideas. Decisions. Preferences. Original words.</text><text x="58" y="450" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#64728a">RUST   /   ENCRYPTED SQLITE   /   READABLE MARKDOWN</text><rect x="754" y="86" width="225" height="84" rx="12" fill="white" stroke="#dce3ed"/><text x="774" y="122" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#1b263b">“I prefer…”</text><path d="M774 143 h85 m10 0 h38" stroke="#dce3ed" stroke-width="5" stroke-linecap="round"/><path d="M979 128 C1082 128 1001 251 1060 251" fill="none" stroke="#279caf" stroke-width="2" stroke-dasharray="4 5"/><rect x="719" y="210" width="225" height="84" rx="12" fill="white" stroke="#dce3ed"/><text x="739" y="246" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#1b263b">“I chose…”</text><path d="M739 267 h85 m10 0 h38" stroke="#dce3ed" stroke-width="5" stroke-linecap="round"/><path d="M944 252 C1082 252 1001 251 1060 251" fill="none" stroke="#279caf" stroke-width="2" stroke-dasharray="4 5"/><rect x="765" y="334" width="225" height="84" rx="12" fill="white" stroke="#dce3ed"/><text x="785" y="370" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#1b263b">“Keep it simple.”</text><path d="M785 391 h85 m10 0 h38" stroke="#dce3ed" stroke-width="5" stroke-linecap="round"/><path d="M990 376 C1082 376 1001 251 1060 251" fill="none" stroke="#279caf" stroke-width="2" stroke-dasharray="4 5"/><rect x="1060" y="184" width="160" height="145" rx="12" fill="#1b263b"/><path d="M1082 184 v145" stroke="#279caf" stroke-width="3"/><text x="1097" y="225" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">a living</text><text x="1097" y="253" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">record</text><path d="M1097 281 h90 m-90 14 h64" stroke="#7a8aa8" stroke-width="3" stroke-linecap="round"/></svg>
