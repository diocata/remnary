name: Rust checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
          - runner: macos-26
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install tested Rust toolchain
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.target }} --component clippy,rustfmt,rust-docs
      - name: Native Perl for vendored OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path C:\Strawberry\perl\bin\perl.exe)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compiler-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ matrix.target }}
            target/package-build
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - name: Tests, lint, native release build, runtime smoke and target notices
        id: native-build
        run: python scripts/package-release.py --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler cache after completed or failed builds
        if: always() && !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' && (steps.native-build.outcome == 'success' || steps.native-build.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/${{ matrix.target }}
            target/package-build
          key: native-${{ matrix.target }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

  advisory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  publish:
    name: Publish checked release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, advisory]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate every target, upload draft assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --tag "$GITHUB_REF_NAME" --directory release-assets
