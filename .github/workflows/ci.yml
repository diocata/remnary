name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Install advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - name: Release binary starts
        run: target/release/observr --version
