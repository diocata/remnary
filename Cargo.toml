[package]
name = "observr"
version = "0.1.0"
edition = "2024"
description = "Local-first, evidence-backed intelligence from AI conversations"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
