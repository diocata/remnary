[package]
name = "observr"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local-first, evidence-backed intelligence from AI conversations"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6"
fs2 = "0.4"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tiny_http = "0.12"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
